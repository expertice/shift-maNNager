name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:  # Позволяет запускать вручную

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '18'

jobs:
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies (Frontend)
        run: npm ci
      
      - name: 📦 Install dependencies (Backend)
        run: cd server && npm ci
      
      - name: ✨ ESLint (Frontend)
        run: npm run lint
        continue-on-error: false
      
      - name: ✨ ESLint (Backend)
        run: cd server && npm run lint
        continue-on-error: false
      
      - name: 💅 Prettier check (Frontend)
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
        continue-on-error: false
      
      - name: 💅 Prettier check (Backend)
        run: cd server && npx prettier --check "src/**/*.{ts,js,json}"
        continue-on-error: false

  type-check:
    name: 📝 TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies (Frontend)
        run: npm ci
      
      - name: 📦 Install dependencies (Backend)
        run: cd server && npm ci
      
      - name: 🔎 Type check (Frontend)
        run: npx tsc --noEmit
      
      - name: 🔎 Type check (Backend)
        run: cd server && npx tsc --noEmit

  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
      JWT_SECRET: test-secret-key
      NODE_ENV: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: cd server && npm ci
      
      - name: 🗄️ Run Prisma migrations
        run: cd server && npx prisma migrate deploy
      
      - name: 🧪 Run tests
        run: cd server && npm run test
      
      - name: 📊 Generate coverage report
        run: cd server && npm run test:coverage
        continue-on-error: true
      
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
        continue-on-error: true

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🧪 Run tests
        run: npm run test
      
      - name: 📊 Generate coverage report
        run: npm run test:coverage
        continue-on-error: true
      
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  build-backend:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: cd server && npm ci
      
      - name: 🏗️ Build application
        run: cd server && npm run build
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: server/dist/
          retention-days: 5

  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-frontend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api/v1' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || 'http://localhost:3000' }}
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: dist/
          retention-days: 5

  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏷️ Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: 🏷️ Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: 📥 Download backend artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: server/dist/
      
      - name: 📥 Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: dist/
      
      - name: 🐳 Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./documents/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🐳 Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: 📤 Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: 🔍 NPM Audit (Backend)
        run: cd server && npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: 🔍 NPM Audit (Frontend)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.shift-manager.com
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy to Staging Server
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          # Здесь добавьте ваш скрипт деплоя на staging
          # Например, SSH подключение и выполнение команд:
          # ssh user@staging-server 'cd /app && docker-compose pull && docker-compose up -d'
      
      - name: ✅ Deployment Success
        run: echo "✅ Successfully deployed to staging!"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://shift-manager.com
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy to Production Server
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          # Здесь добавьте ваш скрипт деплоя на production
          # Например:
          # ssh user@production-server 'cd /app && docker-compose pull && docker-compose up -d'
      
      - name: ✅ Deployment Success
        run: echo "✅ Successfully deployed to production!"
      
      - name: 📢 Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            🎉 New production release!
            
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            
            See CHANGELOG.md for details.
          draft: false
          prerelease: false
        continue-on-error: true

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: 📢 Send notification
        run: |
          echo "Pipeline completed!"
          echo "Status: ${{ job.status }}"
          # Добавьте интеграцию с Slack/Discord/Email если нужно
          # например через webhook:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text":"Deploy completed!"}'

