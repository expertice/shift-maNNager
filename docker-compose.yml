services:
  postgres:
    image: postgres:16-alpine
    container_name: shift-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shift_manager
      POSTGRES_PASSWORD: shift_manager_pass
      POSTGRES_DB: shift_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shift_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

